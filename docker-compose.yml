# Local/staging stack: API + MongoDB + Redis.
#   cp .env.example .env   # fill in the JWT secrets
#   docker compose up --build
services:
  api:
    build: .
    env_file: .env
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/holoapp
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mongo-data:
